<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submission complete</title>
  <style>
    :root { --ink: #172033; --muted: #697386; --line: #e4e9f1; --accent: #5b5ce2; --accent-soft: #eeefff; --paper: #fff; --page: #f5f7fb; }
    * { box-sizing: border-box; }
    body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 20px; background: var(--page); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
    .confirmation-box { width: min(100%, 500px); padding: 42px 30px 30px; border: 1px solid var(--line); border-radius: 22px; background: var(--paper); box-shadow: 0 18px 42px rgba(32, 44, 74, .1); text-align: center; }
    .success-icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: #e6f7ef; color: #11845b; font-size: 30px; font-weight: 900; }
    h1 { margin: 0; font-size: clamp(25px, 6vw, 34px); letter-spacing: -.04em; }
    p { margin: 10px auto 0; max-width: 350px; color: var(--muted); }
    .next-step { margin-top: 24px; padding: 13px 16px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; }
    .actions { display: flex; justify-content: center; gap: 9px; margin-top: 22px; }
    button { min-height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    @media print { body { min-height: auto; padding: 0; background: #fff; } .confirmation-box { border: 0; box-shadow: none; } .actions { display: none; } }
  </style>
</head>
<body>
  <main class="confirmation-box" role="status">
    <div class="success-icon" aria-hidden="true">✓</div>
    <h1>Thank you!</h1>
    <p>Your information has been successfully submitted.</p>
    <div class="next-step">Your submission is complete. You can safely close this window.</div>
    <div class="actions"><button type="button" onclick="window.print()">Print confirmation</button></div>
  </main>
</body>
</html>
